<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SachCast TV Receiver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Screen Display Containers */
    #displayContainer {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: none;
    }

    /* Standby overlay */
    #standbyScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #1e3a8a 0%, #030712 100%);
      z-index: 10;
      text-align: center;
      padding: 2.5rem;
      transition: opacity 0.5s ease;
    }

    .radar-icon {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: grid;
      place-items: center;
      box-shadow: 0 0 50px rgba(59, 130, 246, 0.7);
      margin-bottom: 2rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 800;
      margin-bottom: 0.85rem;
      letter-spacing: -0.02em;
    }

    p {
      color: #94a3b8;
      font-size: 1.3rem;
      max-width: 700px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.1rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 0.65rem 1.6rem;
      border-radius: 9999px;
      font-weight: 700;
    }

    .indicator-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 12px #10b981;
    }

    /* TV HUD */
    .tv-hud {
      position: absolute;
      top: 1.75rem;
      right: 1.75rem;
      z-index: 25;
      display: flex;
      gap: 0.75rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    body:hover .tv-hud, body:focus-within .tv-hud {
      opacity: 1;
    }

    .hud-btn {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }

    .hud-btn:hover, .hud-btn:focus {
      background: #3b82f6;
      border-color: #3b82f6;
    }

    /* Flash ping alert */
    #flashOverlay {
      position: absolute;
      inset: 0;
      background: rgba(59, 130, 246, 0.4);
      z-index: 40;
      pointer-events: none;
      display: none;
    }

    /* Audio alert prompt */
    #audioPrompt {
      display: none;
      position: absolute;
      bottom: 2.5rem;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #3b82f6;
      border-radius: 16px;
      padding: 1.1rem 2rem;
      z-index: 30;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="flashOverlay"></div>

  <div class="tv-hud">
    <button class="hud-btn" id="streamModeBtn" onclick="toggleEngineMode()">Engine: WebRTC 60fps</button>
    <button class="hud-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
  </div>

  <div id="standbyScreen">
    <div class="radar-icon">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
        <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1 id="screenTitle">Connected to SachCast</h1>
    <p id="screenSubtitle">Paired with PC. Waiting for you to click "Share Screen" on your computer...</p>

    <div class="status-badge" id="statusBadge">
      <div class="indicator-dot"></div>
      <span id="statusLabel">Ready & Waiting for Screen</span>
    </div>
  </div>

  <div id="displayContainer">
    <video id="tvVideo" autoplay playsinline></video>
    <canvas id="tvCanvas"></canvas>
  </div>

  <div id="audioPrompt" onclick="enableAudio()">
    🔊 Audio muted by TV browser. Click anywhere or press Remote OK to unmute!
  </div>

  <script>
    const tvVideo = document.getElementById('tvVideo');
    const tvCanvas = document.getElementById('tvCanvas');
    const canvasCtx = tvCanvas.getContext('2d');
    const standbyScreen = document.getElementById('standbyScreen');
    const screenTitle = document.getElementById('screenTitle');
    const screenSubtitle = document.getElementById('screenSubtitle');
    const statusLabel = document.getElementById('statusLabel');
    const audioPrompt = document.getElementById('audioPrompt');
    const flashOverlay = document.getElementById('flashOverlay');
    const streamModeBtn = document.getElementById('streamModeBtn');

    let ws = null;
    let pc = null;
    let presenterId = null;
    let pendingCandidates = [];
    let activeEngine = 'webrtc'; // 'webrtc' or 'canvas'
    let currentRoomCode = null;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' }
      ]
    };

    function connectSignaling() {
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${window.location.host}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusLabel.innerText = 'Connected to Wi-Fi Hub';
        ws.send(JSON.stringify({ type: 'register-viewer', code: currentRoomCode }));
      };

      ws.onmessage = async (event) => {
        // 1. Binary frames = Universal Canvas Streaming
        if (event.data instanceof Blob || event.data instanceof ArrayBuffer) {
          handleBinaryCanvasFrame(event.data);
          return;
        }

        // 2. JSON control messages
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === 'join-success') {
            currentRoomCode = msg.code;
            presenterId = msg.presenterId;
            if (msg.hasPresenter) {
              screenTitle.innerText = 'Paired With PC!';
              screenSubtitle.innerText = 'Ready! Click "Share Screen" on your PC to broadcast.';
              statusLabel.innerText = 'Paired with PC Studio';
            }
          } else if (msg.type === 'presenter-connected') {
            presenterId = msg.presenterId;
            screenTitle.innerText = 'PC Connected!';
            screenSubtitle.innerText = 'Click "Share Screen" on your computer to start mirroring.';
            statusLabel.innerText = 'PC Ready';
          } else if (msg.type === 'offer') {
            presenterId = msg.from;
            await handleOffer(msg.sdp);
          } else if (msg.type === 'ice-candidate') {
            if (msg.candidate) {
              if (pc && pc.remoteDescription && pc.remoteDescription.type) {
                try {
                  await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                } catch (e) {}
              } else {
                pendingCandidates.push(msg.candidate);
              }
            }
          } else if (msg.type === 'tv-ping') {
            flashScreen();
          } else if (msg.type === 'stream-stopped' || msg.type === 'presenter-disconnected') {
            showStandby('Broadcast Ended', 'Waiting for PC to resume sharing...');
          }
        } catch (err) {
          console.warn('Error parsing message:', err);
        }
      };

      ws.onclose = () => {
        statusLabel.innerText = 'Reconnecting to PC...';
        setTimeout(connectSignaling, 2000);
      };
    }

    async function handleOffer(sdp) {
      if (pc) pc.close();
      pc = new RTCPeerConnection(rtcConfig);

      pc.ontrack = (event) => {
        hideStandby();
        tvVideo.style.display = 'block';
        tvCanvas.style.display = 'none';
        activeEngine = 'webrtc';
        streamModeBtn.innerText = 'Engine: WebRTC 60fps';

        tvVideo.srcObject = event.streams[0];
        tvVideo.play().catch(() => {
          audioPrompt.style.display = 'block';
        });
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'ice-candidate',
            target: presenterId,
            candidate: event.candidate
          }));
        }
      };

      await pc.setRemoteDescription(new RTCSessionDescription(sdp));

      while (pendingCandidates.length > 0) {
        const cand = pendingCandidates.shift();
        try {
          await pc.addIceCandidate(new RTCIceCandidate(cand));
        } catch (e) {}
      }

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      ws.send(JSON.stringify({
        type: 'answer',
        target: presenterId,
        sdp: pc.localDescription
      }));
    }

    // Universal Mode: handles raw JPEG/WebP binary frames from PC
    function handleBinaryCanvasFrame(data) {
      hideStandby();
      tvVideo.style.display = 'none';
      tvCanvas.style.display = 'block';
      activeEngine = 'canvas';
      streamModeBtn.innerText = 'Engine: Universal Canvas';

      const blob = data instanceof Blob ? data : new Blob([data], { type: 'image/jpeg' });
      const imgUrl = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        if (tvCanvas.width !== img.width || tvCanvas.height !== img.height) {
          tvCanvas.width = img.width;
          tvCanvas.height = img.height;
        }
        canvasCtx.drawImage(img, 0, 0);
        URL.revokeObjectURL(imgUrl);
      };
      img.src = imgUrl;
    }

    function hideStandby() {
      standbyScreen.style.opacity = '0';
      setTimeout(() => {
        standbyScreen.style.display = 'none';
      }, 400);
    }

    function showStandby(title, sub) {
      standbyScreen.style.display = 'flex';
      setTimeout(() => { standbyScreen.style.opacity = '1'; }, 10);
      screenTitle.innerText = title;
      screenSubtitle.innerText = sub;
      tvVideo.srcObject = null;
      tvVideo.style.display = 'none';
      tvCanvas.style.display = 'none';
    }

    function flashScreen() {
      flashOverlay.style.display = 'block';
      setTimeout(() => { flashOverlay.style.display = 'none'; }, 500);
    }

    function enableAudio() {
      tvVideo.muted = false;
      tvVideo.play();
      audioPrompt.style.display = 'none';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function toggleEngineMode() {
      // Allow TV user to switch preference
      alert('Active Streaming Engine: ' + (activeEngine === 'webrtc' ? 'WebRTC 60fps Ultra Low Latency' : 'Universal Canvas Stream'));
    }

    // TV Remote OK / Enter / Click triggers fullscreen & unmutes audio automatically
    window.addEventListener('keydown', (e) => {
      enableAudio();
      if (e.key === 'Enter' || e.key === 'f' || e.key === 'F') {
        toggleFullScreen();
      }
    });

    window.addEventListener('click', () => {
      enableAudio();
    });

    connectSignaling();
  </script>
</body>
</html>
