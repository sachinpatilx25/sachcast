<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirCast TV Receiver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030712;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #videoContainer {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }

    /* Standby overlay */
    #standbyScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #172554 0%, #030712 100%);
      z-index: 10;
      text-align: center;
      padding: 2rem;
      transition: opacity 0.5s ease;
    }

    .radar-icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: grid;
      place-items: center;
      box-shadow: 0 0 40px rgba(59, 130, 246, 0.6);
      margin-bottom: 1.75rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    p {
      color: #94a3b8;
      font-size: 1.25rem;
      max-width: 650px;
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    /* Fast Code Prompt on TV (if user needs to enter 4 digits) */
    .code-box-wrapper {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      backdrop-filter: blur(12px);
    }

    .code-input {
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid #3b82f6;
      border-radius: 12px;
      color: #60a5fa;
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      letter-spacing: 0.3em;
      text-align: center;
      width: 160px;
      padding: 0.5rem;
      outline: none;
    }

    .connect-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 0.85rem 1.75rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5);
    }

    .connect-btn:hover {
      background: #2563eb;
    }

    .status-badge {
      margin-top: 1.75rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-weight: 600;
    }

    .indicator-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    /* TV Remote Controls Floating */
    .tv-hud {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 20;
    }

    .fullscreen-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }

    .fullscreen-btn:hover, .fullscreen-btn:focus {
      background: #3b82f6;
      border-color: #3b82f6;
    }

    #audioPrompt {
      display: none;
      position: absolute;
      bottom: 2rem;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #3b82f6;
      border-radius: 14px;
      padding: 1rem 1.75rem;
      z-index: 30;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="tv-hud">
    <button class="fullscreen-btn" id="fsBtn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
  </div>

  <div id="standbyScreen">
    <div class="radar-icon">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
        <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1 id="screenTitle">Connected to AirCast</h1>
    <p id="screenSubtitle">Auto-connecting to your PC screen. Please wait...</p>

    <!-- Optional Manual TV Code Input (if needed) -->
    <div class="code-box-wrapper" id="codeBoxWrapper" style="display: none;">
      <input type="text" id="manualCode" class="code-input" maxlength="4" placeholder="Code">
      <button class="connect-btn" onclick="submitManualCode()">Connect</button>
    </div>

    <div class="status-badge" id="statusBadge">
      <div class="indicator-dot"></div>
      <span id="statusLabel">Auto-syncing with PC screen...</span>
    </div>
  </div>

  <div id="videoContainer">
    <video id="tvVideo" autoplay playsinline></video>
  </div>

  <div id="audioPrompt" onclick="enableAudio()">
    🔊 Click anywhere or press Remote OK to unmute sound
  </div>

  <script>
    const tvVideo = document.getElementById('tvVideo');
    const standbyScreen = document.getElementById('standbyScreen');
    const screenTitle = document.getElementById('screenTitle');
    const screenSubtitle = document.getElementById('screenSubtitle');
    const codeBoxWrapper = document.getElementById('codeBoxWrapper');
    const statusLabel = document.getElementById('statusLabel');
    const audioPrompt = document.getElementById('audioPrompt');

    let ws = null;
    let pc = null;
    let myId = null;
    let presenterId = null;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function connectSignaling(userProvidedCode) {
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${window.location.host}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusLabel.innerText = 'Connected to local Wi-Fi hub';
        // Auto-join the active PC screen broadcast
        ws.send(JSON.stringify({
          type: 'register-viewer',
          code: userProvidedCode || null
        }));
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === 'welcome') {
          myId = msg.id;
        } else if (msg.type === 'join-success') {
          presenterId = msg.presenterId;
          screenTitle.innerText = 'Paired With PC!';
          screenSubtitle.innerText = 'Screen broadcast is starting...';
          codeBoxWrapper.style.display = 'none';
        } else if (msg.type === 'waiting-for-stream') {
          screenTitle.innerText = 'Waiting for Presenter';
          screenSubtitle.innerText = 'Click "Share Screen" on your PC, or enter the 4-digit code shown on your PC:';
          codeBoxWrapper.style.display = 'flex';
          statusLabel.innerText = 'Waiting for PC broadcast';
        } else if (msg.type === 'offer') {
          presenterId = msg.from;
          await handleOffer(msg.sdp);
        } else if (msg.type === 'ice-candidate') {
          if (pc && msg.candidate) {
            try {
              await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
            } catch (err) {
              console.error('ICE candidate error:', err);
            }
          }
        } else if (msg.type === 'presenter-left') {
          showStandby('Presenter Stopped Broadcast', 'Waiting for PC to resume sharing...');
        }
      };

      ws.onclose = () => {
        statusLabel.innerText = 'Reconnecting...';
        setTimeout(() => connectSignaling(userProvidedCode), 2000);
      };
    }

    async function handleOffer(sdp) {
      if (pc) pc.close();
      pc = new RTCPeerConnection(rtcConfig);

      pc.ontrack = (event) => {
        standbyScreen.style.opacity = '0';
        setTimeout(() => {
          standbyScreen.style.display = 'none';
        }, 500);

        tvVideo.srcObject = event.streams[0];
        tvVideo.play().catch(() => {
          audioPrompt.style.display = 'block';
        });
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'ice-candidate',
            target: presenterId,
            candidate: event.candidate
          }));
        }
      };

      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      ws.send(JSON.stringify({
        type: 'answer',
        target: presenterId,
        sdp: pc.localDescription
      }));
    }

    function showStandby(title, sub) {
      standbyScreen.style.display = 'flex';
      setTimeout(() => { standbyScreen.style.opacity = '1'; }, 10);
      screenTitle.innerText = title;
      screenSubtitle.innerText = sub;
      tvVideo.srcObject = null;
    }

    function submitManualCode() {
      const code = document.getElementById('manualCode').value.trim();
      if (code.length === 4 && ws) {
        ws.send(JSON.stringify({ type: 'register-viewer', code: code }));
      }
    }

    function enableAudio() {
      tvVideo.muted = false;
      tvVideo.play();
      audioPrompt.style.display = 'none';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Remote control bindings
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (codeBoxWrapper.style.display === 'flex') {
          submitManualCode();
        } else {
          toggleFullScreen();
          enableAudio();
        }
      }
    });

    window.addEventListener('click', () => {
      enableAudio();
    });

    // Start auto connect
    connectSignaling();
  </script>
</body>
</html>
