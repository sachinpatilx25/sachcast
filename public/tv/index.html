<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SachCast - TV Receiver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- PeerJS -->
  <script src="/peerjs.min.js"></script>
  <script>
    if (typeof Peer === 'undefined') {
      document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    #displayContainer {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000000;
    }

    /* Minimalist Standby Overlay */
    #standbyScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      z-index: 10;
      text-align: center;
      padding: 2.5rem;
      transition: opacity 0.4s ease;
    }

    .minimal-icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #0a0a0a;
      border: 1px solid #222222;
      display: grid;
      place-items: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.03em;
      color: #ffffff;
    }

    p {
      color: #777777;
      font-size: 1.15rem;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* Minimal Code Box */
    .code-box-wrapper {
      background: #0a0a0a;
      border: 1px solid #222222;
      border-radius: 14px;
      padding: 0.85rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .code-input {
      background: #000000;
      border: 1px solid #333333;
      border-radius: 8px;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.6rem;
      letter-spacing: 0.25em;
      text-align: center;
      width: 140px;
      padding: 0.35rem;
      outline: none;
    }

    .code-input:focus {
      border-color: #ffffff;
    }

    .connect-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.7rem 1.4rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .connect-btn:hover {
      background: #e5e5e5;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.95rem;
      color: #888888;
      background: #050505;
      border: 1px solid #222222;
      padding: 0.5rem 1.4rem;
      border-radius: 9999px;
      font-weight: 500;
    }

    .indicator-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
    }

    /* TV HUD */
    .tv-hud {
      position: absolute;
      top: 1.75rem;
      right: 1.75rem;
      z-index: 25;
      display: flex;
      gap: 0.75rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    body:hover .tv-hud, body:focus-within .tv-hud {
      opacity: 1;
    }

    .hud-btn {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #333333;
      color: #ffffff;
      padding: 0.65rem 1.15rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.15s;
    }

    .hud-btn:hover, .hud-btn:focus {
      background: #ffffff;
      color: #000000;
    }

    #flashOverlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.25);
      z-index: 40;
      pointer-events: none;
      display: none;
    }

    #audioPrompt {
      display: none;
      position: absolute;
      bottom: 2.5rem;
      background: #0a0a0a;
      border: 1px solid #333333;
      border-radius: 12px;
      padding: 1rem 1.8rem;
      z-index: 30;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div id="flashOverlay"></div>

  <div class="tv-hud">
    <button class="hud-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
  </div>

  <div id="standbyScreen">
    <div class="minimal-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
        <polyline points="17 2 12 7 7 2"></polyline>
      </svg>
    </div>

    <h1 id="screenTitle">SachCast Receiver</h1>
    <p id="screenSubtitle">Connected to receiver. Waiting for PC screen broadcast...</p>

    <div class="code-box-wrapper">
      <input type="text" id="manualCode" class="code-input" maxlength="4" value="7777">
      <button class="connect-btn" onclick="applyManualCode()">Connect</button>
    </div>

    <div class="status-badge" id="statusBadge">
      <div class="indicator-dot" id="statusDot"></div>
      <span id="statusLabel">Ready</span>
    </div>
  </div>

  <div id="displayContainer">
    <video id="tvVideo" autoplay playsinline></video>
  </div>

  <div id="audioPrompt" onclick="enableAudio()">
    🔊 Audio muted by TV browser. Press Remote OK to unmute.
  </div>

  <script>
    const tvVideo = document.getElementById('tvVideo');
    const standbyScreen = document.getElementById('standbyScreen');
    const screenTitle = document.getElementById('screenTitle');
    const screenSubtitle = document.getElementById('screenSubtitle');
    const statusLabel = document.getElementById('statusLabel');
    const statusDot = document.getElementById('statusDot');
    const audioPrompt = document.getElementById('audioPrompt');
    const flashOverlay = document.getElementById('flashOverlay');
    const manualCodeInput = document.getElementById('manualCode');

    const urlParams = new URLSearchParams(window.location.search);
    let roomCode = urlParams.get('room') || '7777';
    manualCodeInput.value = roomCode;

    let peer = null;
    let dataConn = null;

    const rtcIceConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' }
      ]
    };

    function parseDeviceName() {
      const ua = (navigator.userAgent || '').toLowerCase();
      if (ua.includes('tizen')) return 'Samsung Smart TV';
      if (ua.includes('webos')) return 'LG webOS TV';
      if (ua.includes('googletv') || ua.includes('crkey')) return 'Google TV';
      if (ua.includes('firetv') || ua.includes('aft')) return 'Fire TV';
      if (ua.includes('android')) return 'Android TV';
      return 'Smart TV';
    }

    function initTVPeer() {
      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }

      const viewerPeerId = 'sachcast-tv-' + roomCode + '-' + Math.random().toString(36).substring(2, 7);
      
      peer = new Peer(viewerPeerId, {
        debug: 1,
        config: rtcIceConfig
      });

      peer.on('open', (id) => {
        statusDot.style.background = '#ffffff';
        statusLabel.innerText = 'Connected. Pairing with PC...';
        connectToHost();
      });

      peer.on('call', (call) => {
        call.answer();
        call.on('stream', (remoteStream) => {
          hideStandby();
          tvVideo.srcObject = remoteStream;
          tvVideo.play().catch(() => {
            audioPrompt.style.display = 'block';
          });
        });
      });

      peer.on('error', (err) => {
        console.warn('TV Peer error:', err.type);
        statusLabel.innerText = 'Retrying...';
      });
    }

    function connectToHost() {
      if (!peer || peer.destroyed) return;
      const hostPeerId = 'sachcast-host-' + roomCode;

      if (dataConn) {
        try { dataConn.close(); } catch (e) {}
      }

      dataConn = peer.connect(hostPeerId);

      dataConn.on('open', () => {
        statusLabel.innerText = 'Paired with PC';
        screenTitle.innerText = 'Paired with PC';
        screenSubtitle.innerText = 'Click "Share Screen" on your computer to broadcast.';
        dataConn.send({ type: 'hello', deviceName: parseDeviceName() });
      });

      dataConn.on('data', (data) => {
        if (data && data.type === 'flash-ping') {
          flashScreen();
        } else if (data && data.type === 'stream-stopped') {
          showStandby('Broadcast Stopped', 'Waiting for PC to resume sharing...');
        }
      });

      dataConn.on('close', () => {
        statusLabel.innerText = 'Waiting for PC...';
      });
    }

    function applyManualCode() {
      const code = manualCodeInput.value.trim();
      if (code.length >= 4) {
        roomCode = code;
        statusLabel.innerText = `Connecting to [ ${code} ]...`;
        initTVPeer();
      }
    }

    function hideStandby() {
      standbyScreen.style.opacity = '0';
      setTimeout(() => {
        standbyScreen.style.display = 'none';
      }, 400);
    }

    function showStandby(title, sub) {
      standbyScreen.style.display = 'flex';
      setTimeout(() => { standbyScreen.style.opacity = '1'; }, 10);
      screenTitle.innerText = title;
      screenSubtitle.innerText = sub;
      tvVideo.srcObject = null;
    }

    function flashScreen() {
      flashOverlay.style.display = 'block';
      setTimeout(() => { flashOverlay.style.display = 'none'; }, 400);
    }

    function enableAudio() {
      tvVideo.muted = false;
      tvVideo.play();
      audioPrompt.style.display = 'none';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener('keydown', (e) => {
      enableAudio();
      if (e.key === 'Enter') {
        if (standbyScreen.style.display !== 'none' && document.activeElement === manualCodeInput) {
          applyManualCode();
        } else {
          toggleFullScreen();
        }
      }
    });

    window.addEventListener('click', () => {
      enableAudio();
    });

    setInterval(() => {
      if (!dataConn || !dataConn.open) {
        connectToHost();
      }
    }, 5000);

    initTVPeer();
  </script>
</body>
</html>
