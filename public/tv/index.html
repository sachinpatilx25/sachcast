<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SachCast - TV Receiver</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <script src="/peerjs.min.js"></script>
  <script>
    if (typeof Peer === 'undefined') {
      document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Clear screen mode: hide cursor cleanly when video is playing */
    body.playing {
      cursor: none !important;
    }

    #displayContainer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    video {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000000;
      border: none;
      outline: none;
      pointer-events: none;
      transition: object-fit 0.15s ease;
    }

    /* Discreet hint that never blocks the screen and auto-fades in 3.5s */
    #unmuteFloatingBtn {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(18, 18, 18, 0.92);
      color: #ffffff;
      padding: 0.65rem 1.25rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      z-index: 99999;
      display: none;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
      transition: opacity 0.3s ease;
    }

    .tv-toast {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #141414;
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-size: 1.1rem;
      font-weight: 600;
      border: 1px solid #333333;
      z-index: 99999;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s ease;
    }

    .tv-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Netflix-Grade WebVTT Subtitle Styling */
    ::cue {
      background-color: rgba(0, 0, 0, 0.78) !important;
      color: #ffffff !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
      font-size: 1.4rem !important;
      font-weight: 600 !important;
      line-height: 1.4 !important;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9) !important;
      border-radius: 6px !important;
      padding: 4px 12px !important;
    }

    /* Web Video Caster / Netflix Grade Smart TV Heads-Up Display */
    .tv-osd {
      position: fixed;
      bottom: 2rem;
      left: 3rem;
      right: 3rem;
      background: rgba(14, 14, 14, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      padding: 1.25rem 2rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      pointer-events: none;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
    }

    .tv-osd.show {
      opacity: 1;
      transform: translateY(0);
    }

    .osd-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .osd-title-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .osd-live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
    }

    .osd-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      max-width: 50vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .osd-badge-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .osd-badge {
      background: #1e1e1e;
      border: 1px solid #333333;
      color: #dddddd;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    .osd-progress-wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .osd-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 600;
      color: #aaaaaa;
      min-width: 50px;
    }

    .osd-bar-bg {
      position: relative;
      flex: 1;
      height: 6px;
      background: #262626;
      border-radius: 9999px;
      overflow: hidden;
    }

    .osd-bar-buffered {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: #444444;
      border-radius: 9999px;
      width: 0%;
      transition: width 0.2s ease;
    }

    .osd-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: #ffffff;
      border-radius: 9999px;
      width: 0%;
      transition: width 0.15s ease;
    }

    #standbyScreen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      z-index: 10;
      text-align: center;
      padding: 2.5rem;
    }

    #standbyScreen.hidden {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      opacity: 0 !important;
    }

    .minimal-icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #0a0a0a;
      border: 1px solid #222222;
      display: grid;
      place-items: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.03em;
      color: #ffffff;
    }

    p {
      color: #777777;
      font-size: 1.15rem;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .code-box-wrapper {
      background: #0a0a0a;
      border: 1px solid #222222;
      border-radius: 14px;
      padding: 0.85rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .code-input {
      background: #000000;
      border: 1px solid #333333;
      border-radius: 8px;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.6rem;
      letter-spacing: 0.25em;
      text-align: center;
      width: 140px;
      padding: 0.35rem;
      outline: none;
    }

    .code-input:focus {
      border-color: #ffffff;
    }

    .connect-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.7rem 1.4rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .connect-btn:hover {
      background: #e5e5e5;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.95rem;
      color: #888888;
      background: #050505;
      border: 1px solid #222222;
      padding: 0.5rem 1.4rem;
      border-radius: 9999px;
      font-weight: 500;
    }

    .indicator-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <div id="standbyScreen">
    <div class="minimal-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
        <polyline points="17 2 12 7 7 2"></polyline>
      </svg>
    </div>

    <h1 id="screenTitle">Welcome to SachCast</h1>
    <p id="screenSubtitle">You're connected! Waiting for your friend to start sharing... 🍿</p>

    <div class="code-box-wrapper">
      <input type="text" id="manualCode" class="code-input" maxlength="4" value="7777">
      <button class="connect-btn" onclick="applyManualCode()">Join</button>
    </div>

    <div class="status-badge" id="statusBadge" onclick="unlockAudio()" style="cursor: pointer;" title="Click to unlock sound">
      <div class="indicator-dot" id="statusDot"></div>
      <span id="statusLabel">Ready</span>
      <span style="color: #ffffff; margin-left: 0.5rem;" id="soundStatusText">🔊 Sound Active</span>
    </div>
  </div>

  <div id="unmuteFloatingBtn" onclick="unlockAudio()">
    🔊 Press any remote button or click for sound
  </div>

  <div id="tvToast" class="tv-toast">👋 Your friend sent a wave!</div>

  <!-- Smart TV On-Screen Display (OSD HUD) -->
  <div id="tvOsd" class="tv-osd">
    <div class="osd-top-row">
      <div class="osd-title-group">
        <span class="osd-live-dot" id="osdPlayStatusDot"></span>
        <span class="osd-title" id="osdTitle">SachCast Stream</span>
      </div>
      <div class="osd-badge-group">
        <span class="osd-badge" id="osdAspectBadge">📺 16:9 Fit</span>
        <span class="osd-badge" id="osdSpeedBadge">1.0x</span>
        <span class="osd-badge" id="osdSubBadge" style="display: none;">💬 SUB</span>
        <span class="osd-badge" id="osdClockBadge">--:--</span>
      </div>
    </div>
    <div class="osd-progress-wrap">
      <span class="osd-time" id="osdCurrentTime">00:00</span>
      <div class="osd-bar-bg">
        <div class="osd-bar-buffered" id="osdBufferBar"></div>
        <div class="osd-bar-fill" id="osdProgressBar"></div>
      </div>
      <span class="osd-time" id="osdTotalTime">00:00</span>
    </div>
  </div>

  <div id="displayContainer">
    <video id="tvVideo" autoplay playsinline webkit-playsinline></video>
  </div>

  <script>
    const tvVideo = document.getElementById('tvVideo');
    const standbyScreen = document.getElementById('standbyScreen');
    const screenTitle = document.getElementById('screenTitle');
    const screenSubtitle = document.getElementById('screenSubtitle');
    const statusLabel = document.getElementById('statusLabel');
    const statusDot = document.getElementById('statusDot');
    const manualCodeInput = document.getElementById('manualCode');

    const urlParams = new URLSearchParams(window.location.search);
    let roomCode = urlParams.get('room') || '7777';
    manualCodeInput.value = roomCode;

    let signalingMode = 'unknown'; // 'lan' or 'cloud'
    let ws = null;
    let peer = null;
    let nativePc = null;
    let nativeDc = null;
    let dataConn = null;
    let currentPresenterId = null;
    let pendingCandidates = [];
    let remoteStream = null;
    let playbackMode = 'webrtc'; // 'webrtc' or 'media'
    let currentMediaTitle = '';

    function formatTime(sec) {
      if (!sec || isNaN(sec) || sec < 0) return '00:00';
      const s = Math.floor(sec);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      const rM = m % 60;
      const rS = s % 60;
      const pad = (n) => n.toString().padStart(2, '0');
      if (h > 0) return `${h}:${pad(rM)}:${pad(rS)}`;
      return `${pad(rM)}:${pad(rS)}`;
    }

    // --- Smart TV Heads-Up Display (OSD HUD) ---
    let osdHideTimer = null;
    function triggerOsd() {
      const osd = document.getElementById('tvOsd');
      if (!osd) return;

      updateOsdDisplay();
      osd.classList.add('show');

      if (osdHideTimer) clearTimeout(osdHideTimer);
      osdHideTimer = setTimeout(() => {
        osd.classList.remove('show');
      }, 3500);
    }

    function updateOsdDisplay() {
      const title = document.getElementById('osdTitle');
      if (title) title.innerText = currentMediaTitle || (playbackMode === 'webrtc' ? 'Screen Share Stream' : 'Video');

      const cur = document.getElementById('osdCurrentTime');
      const dur = document.getElementById('osdTotalTime');
      const fill = document.getElementById('osdProgressBar');
      const buf = document.getElementById('osdBufferBar');
      const clock = document.getElementById('osdClockBadge');
      const aspect = document.getElementById('osdAspectBadge');
      const speed = document.getElementById('osdSpeedBadge');
      const dot = document.getElementById('osdPlayStatusDot');

      if (dot) {
        dot.style.background = tvVideo.paused ? '#eab308' : '#22c55e';
      }
      if (aspect) {
        aspect.innerText = currentAspectRatio === 'fill' ? '↔️ Stretch' : currentAspectRatio === 'cover' ? '🔍 Zoom' : '📺 16:9 Fit';
      }
      if (speed) {
        speed.innerText = (tvVideo.playbackRate || 1.0) + 'x';
      }
      if (clock) {
        const d = new Date();
        clock.innerText = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      if (tvVideo.duration && !isNaN(tvVideo.duration)) {
        if (cur) cur.innerText = formatTime(tvVideo.currentTime);
        if (dur) dur.innerText = formatTime(tvVideo.duration);
        const pct = (tvVideo.currentTime / tvVideo.duration) * 100;
        if (fill) fill.style.width = pct + '%';

        if (tvVideo.buffered && tvVideo.buffered.length > 0) {
          try {
            const bufEnd = tvVideo.buffered.end(tvVideo.buffered.length - 1);
            const bufPct = (bufEnd / tvVideo.duration) * 100;
            if (buf) buf.style.width = Math.min(100, bufPct) + '%';
          } catch(e) {}
        }
      } else {
        if (cur) cur.innerText = 'LIVE';
        if (dur) dur.innerText = '1080p';
        if (fill) fill.style.width = '100%';
      }
    }

    // --- Subtitles Engine (WebVTT & SRT Native Track Support) ---
    let currentSubtitlesVtt = null;
    function applySubtitles(vttText, label = 'Subtitles') {
      currentSubtitlesVtt = vttText;
      const oldTracks = tvVideo.querySelectorAll('track');
      oldTracks.forEach(t => t.remove());

      const subBadge = document.getElementById('osdSubBadge');

      if (!vttText || vttText.trim() === '') {
        if (subBadge) subBadge.style.display = 'none';
        showTvToast('💬 Subtitles Turned Off');
        triggerOsd();
        return;
      }

      try {
        const blob = new Blob([vttText], { type: 'text/vtt' });
        const url = URL.createObjectURL(blob);
        const track = document.createElement('track');
        track.kind = 'subtitles';
        track.label = label;
        track.srclang = 'en';
        track.src = url;
        track.default = true;
        tvVideo.appendChild(track);
        track.mode = 'showing';
        if (tvVideo.textTracks && tvVideo.textTracks[0]) {
          tvVideo.textTracks[0].mode = 'showing';
        }
        if (subBadge) subBadge.style.display = 'inline-block';
        showTvToast('💬 Subtitles Active: ' + label);
        triggerOsd();
      } catch (e) {
        console.warn('Subtitles mount error:', e);
      }
    }

    // --- Playback Speed Control ---
    function applyPlaybackSpeed(speed, showNotice = true) {
      speed = parseFloat(speed) || 1.0;
      tvVideo.playbackRate = speed;
      const speedBadge = document.getElementById('osdSpeedBadge');
      if (speedBadge) speedBadge.innerText = speed + 'x';
      if (showNotice) showTvToast('⚡ Speed: ' + speed + 'x');
      triggerOsd();
    }

    // --- Safe Audio Volume Booster (100% - 200%) ---
    let boostAudioCtx = null;
    let boostGainNode = null;
    let boostSource = null;

    function applyAudioBoost(boostFactor) {
      const factor = parseFloat(boostFactor) || 1.0;
      if (factor <= 1.0) {
        tvVideo.volume = 1.0;
        if (boostGainNode) boostGainNode.gain.value = 1.0;
        showTvToast('🔊 Volume: 100%');
      } else {
        try {
          if (!boostAudioCtx) {
            boostAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            boostGainNode = boostAudioCtx.createGain();
            boostSource = boostAudioCtx.createMediaElementSource(tvVideo);
            boostSource.connect(boostGainNode);
            boostGainNode.connect(boostAudioCtx.destination);
          }
          if (boostAudioCtx.state === 'suspended') {
            boostAudioCtx.resume();
          }
          boostGainNode.gain.value = factor;
          showTvToast(`🔊 Audio Boost: ${Math.round(factor * 100)}%`);
        } catch (e) {
          console.warn('Audio boost error:', e);
        }
      }
      triggerOsd();
    }

    // --- Aspect Ratio Management (Fit, Stretch/Fill, Zoom) ---
    let currentAspectRatio = localStorage.getItem('sachcast_tv_aspect') || 'contain';

    function applyAspectRatio(mode, showNotice = true) {
      if (!['contain', 'fill', 'cover'].includes(mode)) mode = 'contain';
      currentAspectRatio = mode;
      try { localStorage.setItem('sachcast_tv_aspect', mode); } catch (e) {}

      tvVideo.style.objectFit = mode;

      if (showNotice) {
        const notices = {
          contain: '📺 Aspect Ratio: Fit (Original Proportions)',
          fill: '↔️ Aspect Ratio: Stretch (No Black Bars)',
          cover: '🔍 Aspect Ratio: Zoom (Full Screen)'
        };
        showTvToast(notices[mode] || `Aspect: ${mode}`);
      }
      triggerOsd();
    }

    function cycleAspectRatio() {
      if (currentAspectRatio === 'contain') applyAspectRatio('fill');
      else if (currentAspectRatio === 'fill') applyAspectRatio('cover');
      else applyAspectRatio('contain');
    }

    const rtcIceConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' }
      ]
    };

    function parseDeviceName() {
      const ua = (navigator.userAgent || '').toLowerCase();
      if (ua.includes('tizen')) return 'Samsung Smart TV';
      if (ua.includes('webos')) return 'LG webOS TV';
      if (ua.includes('googletv') || ua.includes('crkey')) return 'Google TV';
      if (ua.includes('firetv') || ua.includes('aft')) return 'Fire TV';
      if (ua.includes('android')) return 'Android TV';
      return 'Smart TV';
    }

    // Screen WakeLock to prevent TV screensaver
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          await navigator.wakeLock.request('screen');
        } catch (e) {}
      }
    }
    requestWakeLock();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    // Allow Smart TV hardware decoder to manage its jitter buffer smoothly without 100% CPU lockup
    function tuneMediaReceivers(pc) {
      // Default browser jitter buffer allows hardware decode pipeline to run without stalling
    }

    // Direct HTML5 video audio unmuting (no AudioContext deadlock on TV OS)
    let audioUnlocked = false;
    let unmuteHideTimer = null;

    function unlockAudio() {
      audioUnlocked = true;
      tvVideo.muted = false;
      tvVideo.volume = 1.0;

      const soundText = document.getElementById('soundStatusText');
      if (soundText) soundText.innerText = 'Sound Active 100% 🔊';

      const floatingBtn = document.getElementById('unmuteFloatingBtn');
      if (floatingBtn) {
        floatingBtn.style.opacity = '0';
        floatingBtn.style.display = 'none';
      }

      if (tvVideo.srcObject || tvVideo.src) {
        tvVideo.play().catch(() => {});
      }
    }

    function showFloatingUnmuteBtn() {
      if (audioUnlocked) return;
      const floatingBtn = document.getElementById('unmuteFloatingBtn');
      if (floatingBtn && standbyScreen.classList.contains('hidden')) {
        floatingBtn.style.display = 'inline-flex';
        floatingBtn.style.opacity = '1';
        if (unmuteHideTimer) clearTimeout(unmuteHideTimer);
        // Automatically fade away in 3.5s so it NEVER blocks the TV screen!
        unmuteHideTimer = setTimeout(() => {
          floatingBtn.style.opacity = '0';
          setTimeout(() => { floatingBtn.style.display = 'none'; }, 300);
        }, 3500);
      }
    }

    // Auto-unlock audio on any TV interaction (remote key, click, touch)
    window.addEventListener('click', unlockAudio, { passive: true });
    window.addEventListener('touchstart', unlockAudio, { passive: true });
    window.addEventListener('keydown', unlockAudio, { passive: true });

    // Auto-resume if TV tab is brought back to front
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        requestWakeLock();
        if (tvVideo.srcObject && tvVideo.paused && standbyScreen.style.display === 'none') {
          tvVideo.play().catch(() => {});
        }
      }
    });

    // --- Hybrid Signaling Initialization ---
    function initTVReceiver() {
      if (window.location.protocol === 'file:' || !window.location.host) {
        initTVPeer();
        return;
      }
      tryLocalWebSocket();
    }

    function tryLocalWebSocket() {
      if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${window.location.host}`;
      console.log('[TV Signaling] Connecting to LAN WebSocket:', wsUrl);

      let connected = false;
      try {
        ws = new WebSocket(wsUrl);

        const timeout = setTimeout(() => {
          if (!connected) {
            console.log('[TV Signaling] Local WS timeout. Falling back to PeerJS Cloud...');
            try { ws.close(); } catch(e) {}
            if (!peer || peer.destroyed) {
              initTVPeer();
            }
          }
        }, 2000);

        ws.onopen = () => {
          connected = true;
          clearTimeout(timeout);
          signalingMode = 'lan';
          console.log('[TV Signaling] Connected via Direct LAN WebSocket ⚡');

          statusDot.style.background = '#ffffff';
          statusLabel.innerText = 'Connected (Super Fast ⚡)';
          screenTitle.innerText = 'All Set!';
          screenSubtitle.innerText = 'Waiting for your friend to share their screen... 🍿';

          ws.send(JSON.stringify({
            type: 'register-viewer',
            code: roomCode
          }));
        };

        ws.onmessage = (event) => {
          handleWsMessage(event.data);
        };

        ws.onclose = () => {
          if (signalingMode === 'lan') {
            console.log('[TV Signaling] WS closed.');
            statusDot.style.background = '#888888';
            statusLabel.innerText = 'Reconnecting...';
            if (!peer || peer.destroyed) {
              initTVPeer();
            }
          }
        };

        ws.onerror = () => {
          if (!connected) {
            clearTimeout(timeout);
            if (!peer || peer.destroyed) {
              initTVPeer();
            }
          }
        };
      } catch (e) {
        if (!peer || peer.destroyed) {
          initTVPeer();
        }
      }
    }

    async function handleWsMessage(raw) {
      try {
        const msg = JSON.parse(raw);

        if (msg.type === 'join-success') {
          console.log('[TV LAN] Registered. Room:', msg.code, 'Has presenter:', msg.hasPresenter);
          if (msg.code) {
            roomCode = msg.code;
            manualCodeInput.value = msg.code;
          }
          if (msg.presenterId) currentPresenterId = msg.presenterId;
          statusDot.style.background = '#ffffff';
          statusLabel.innerText = msg.hasPresenter ? 'Connected to Friend ⚡' : 'Waiting for Friend...';
          return;
        }

        if (msg.type === 'presenter-connected') {
          currentPresenterId = msg.presenterId;
          statusLabel.innerText = 'Friend is Ready!';
          screenSubtitle.innerText = 'Connected! Your friend is about to share their screen... 🎬';
          return;
        }

        if (msg.type === 'flash-ping') {
          showTvToast('👋 Your friend sent a wave!');
          return;
        }

        if (msg.type === 'presenter-disconnected') {
          showStandby('Stream Paused', 'Your friend disconnected. Waiting for them to rejoin...');
          return;
        }

        if (msg.type === 'stream-stopped') {
          showStandby('Sharing Stopped', 'Your friend stopped sharing their screen.');
          return;
        }

        // Web Video Caster (Direct High-Quality Media Server Stream)
        if (msg.type === 'cast-media' && msg.mediaUrl) {
          playbackMode = 'media';
          currentMediaTitle = msg.title || 'Video';
          console.log('[TV Media] Playing direct media stream:', msg.mediaUrl);

          if (nativePc) {
            try { nativePc.close(); nativePc = null; } catch (e) {}
          }

          tvVideo.srcObject = null;
          remoteStream = null;
          tvVideo.removeAttribute('src');
          const fullMediaUrl = msg.mediaUrl.startsWith('http') ? msg.mediaUrl : (window.location.origin + msg.mediaUrl);
          tvVideo.src = fullMediaUrl;
          tvVideo.currentTime = msg.startTime || 0;
          tvVideo.muted = false;
          tvVideo.volume = 1.0;
          hideStandby();
          tvVideo.play().catch(() => {
            tvVideo.muted = true;
            tvVideo.play().catch(() => {});
          });
          return;
        }

        if (msg.type === 'media-control') {
          if (msg.action === 'play') tvVideo.play().catch(() => {});
          if (msg.action === 'pause') tvVideo.pause();
          if (msg.action === 'seek' && typeof msg.time === 'number') {
            tvVideo.currentTime = msg.time;
          }
          if (msg.action === 'jump' && typeof msg.delta === 'number') {
            tvVideo.currentTime += msg.delta;
          }
          if (msg.action === 'volume' && typeof msg.level === 'number') {
            tvVideo.volume = Math.max(0, Math.min(1, msg.level));
          }
          return;
        }

        if (msg.type === 'switch-to-screen') {
          playbackMode = 'webrtc';
          tvVideo.pause();
          tvVideo.removeAttribute('src');
          tvVideo.load();
          showStandby('Welcome to SachCast', 'Waiting for your friend to start sharing... 🍿');
          return;
        }

        if (msg.type === 'unmute-sound') {
          unlockAudio();
          showTvToast('🔊 Sound Active 100%');
          return;
        }

        if (msg.type === 'set-aspect-ratio' && msg.fit) {
          applyAspectRatio(msg.fit, true);
          return;
        }

        if (msg.type === 'set-subtitles') {
          applySubtitles(msg.vttContent, msg.label || 'Subtitles');
          return;
        }

        if (msg.type === 'set-speed') {
          applyPlaybackSpeed(msg.speed, true);
          return;
        }

        if (msg.type === 'set-audio-boost') {
          applyAudioBoost(msg.boost);
          return;
        }

        if (msg.type === 'trigger-osd') {
          triggerOsd();
          return;
        }

        // WebRTC Offer from Presenter
        if (msg.type === 'signal-offer' && msg.offer) {
          playbackMode = 'webrtc';
          tvVideo.removeAttribute('src');
          currentPresenterId = msg.from;
          await handleNativeOffer(msg.offer, msg.from);
          return;
        }

        // ICE Candidate from Presenter
        if (msg.type === 'signal-candidate' && msg.candidate) {
          if (nativePc && nativePc.remoteDescription) {
            await nativePc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(() => {});
          } else {
            pendingCandidates.push(msg.candidate);
          }
          return;
        }

      } catch (err) {
        console.warn('TV WS parse error:', err);
      }
    }

    async function handleNativeOffer(offer, presenterId) {
      console.log('[WebRTC LAN] Processing offer from presenter:', presenterId);

      if (nativePc) {
        try { nativePc.close(); } catch(e) {}
      }

      nativePc = new RTCPeerConnection(rtcIceConfig);

      nativePc.ontrack = (event) => {
        console.log('[WebRTC LAN] Remote track received:', event.track.kind);
        
        tvVideo.removeAttribute('src');
        if (event.streams && event.streams[0]) {
          remoteStream = event.streams[0];
          if (tvVideo.srcObject !== remoteStream) {
            tvVideo.srcObject = remoteStream;
          }
        } else {
          if (!remoteStream) {
            remoteStream = new MediaStream();
            tvVideo.srcObject = remoteStream;
          }
          if (!remoteStream.getTracks().includes(event.track)) {
            remoteStream.addTrack(event.track);
          }
        }

        tuneMediaReceivers(nativePc);
        hideStandby();

        tvVideo.muted = false;
        tvVideo.volume = 1.0;
        tvVideo.play().then(() => {
          const btn = document.getElementById('unmuteFloatingBtn');
          if (btn) btn.style.display = 'none';
        }).catch(() => {
          tvVideo.muted = true;
          tvVideo.play().catch(() => {});
          showFloatingUnmuteBtn();
        });
      };

      nativePc.ondatachannel = (event) => {
        nativeDc = event.channel;
        setupDataChannel(nativeDc);
      };

      nativePc.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'signal-candidate',
            target: presenterId,
            candidate: event.candidate
          }));
        }
      };

      try {
        await nativePc.setRemoteDescription(new RTCSessionDescription(offer));
        tuneMediaReceivers(nativePc);

        // Safely drain all candidates that arrived before remoteDescription was set
        const queued = pendingCandidates.splice(0, pendingCandidates.length);
        for (const cand of queued) {
          try {
            await nativePc.addIceCandidate(new RTCIceCandidate(cand));
          } catch (e) {}
        }

        const answer = await nativePc.createAnswer();
        await nativePc.setLocalDescription(answer);

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'signal-answer',
            target: presenterId,
            answer: nativePc.localDescription
          }));
        }
      } catch (err) {
        console.error('Error handling native offer:', err);
      }
    }

    function setupDataChannel(dc) {
      dc.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'ping' && data.t) {
            if (dc.readyState === 'open') {
              dc.send(JSON.stringify({ type: 'pong', t: data.t }));
            }
          } else if (data.type === 'set-aspect-ratio' && data.fit) {
            applyAspectRatio(data.fit, true);
          } else if (data.type === 'set-subtitles') {
            applySubtitles(data.vttContent, data.label || 'Subtitles');
          } else if (data.type === 'set-speed') {
            applyPlaybackSpeed(data.speed, true);
          } else if (data.type === 'set-audio-boost') {
            applyAudioBoost(data.boost);
          } else if (data.type === 'trigger-osd') {
            triggerOsd();
          }
        } catch (e) {}
      };
    }

    // --- PeerJS Cloud Fallback ---
    function initTVPeer() {
      if (peer && !peer.destroyed) return;
      signalingMode = 'cloud';
      const viewerPeerId = 'sachcast-tv-' + roomCode + '-' + Math.random().toString(36).substring(2, 7);
      console.log('[PeerJS Cloud] Starting TV peer with ID:', viewerPeerId);

      peer = new Peer(viewerPeerId, {
        debug: 1,
        config: rtcIceConfig
      });

      peer.on('open', () => {
        statusDot.style.background = '#ffffff';
        statusLabel.innerText = 'Connected (Cloud ☁️)';
        connectToHostPeerJS();
      });

      peer.on('call', (call) => {
        call.answer();

        if (call.peerConnection) {
          tuneMediaReceivers(call.peerConnection);
        }

        call.on('stream', (stream) => {
          hideStandby();
          tvVideo.removeAttribute('src');
          remoteStream = stream;
          if (tvVideo.srcObject !== remoteStream) {
            tvVideo.srcObject = remoteStream;
          }
          tuneMediaReceivers(call.peerConnection);

          tvVideo.muted = false;
          tvVideo.volume = 1.0;
          tvVideo.play().then(() => {
            const btn = document.getElementById('unmuteFloatingBtn');
            if (btn) btn.style.display = 'none';
          }).catch(() => {
            tvVideo.muted = true;
            tvVideo.play().catch(() => {});
            showFloatingUnmuteBtn();
          });
        });
      });

      peer.on('error', (err) => {
        console.warn('TV Peer error:', err.type);
        statusLabel.innerText = 'Retrying connection...';
      });
    }

    function connectToHostPeerJS() {
      if (!peer || peer.destroyed) return;
      const hostPeerId = 'sachcast-host-' + roomCode;

      if (dataConn) {
        try { dataConn.close(); } catch (e) {}
      }

      dataConn = peer.connect(hostPeerId);

      dataConn.on('open', () => {
        statusLabel.innerText = 'Connected ☁️';
        screenTitle.innerText = 'All Set!';
        screenSubtitle.innerText = 'Waiting for your friend to start sharing... 🍿';
        dataConn.send({ type: 'hello', deviceName: parseDeviceName() });
      });

      dataConn.on('data', (data) => {
        if (!data) return;
        if (data.type === 'stream-stopped') {
          showStandby('Sharing Stopped', 'Your friend stopped sharing their screen.');
        } else if (data.type === 'flash-ping') {
          showTvToast('👋 Your friend sent a wave!');
        } else if (data.type === 'unmute-sound') {
          unlockAudio();
          showTvToast('🔊 Sound Active 100%');
        } else if (data.type === 'cast-media' && data.mediaUrl) {
          playbackMode = 'media';
          currentMediaTitle = data.title || 'Video';
          tvVideo.srcObject = null;
          remoteStream = null;
          tvVideo.removeAttribute('src');
          const fullMediaUrl = data.mediaUrl.startsWith('http') ? data.mediaUrl : (window.location.origin + data.mediaUrl);
          tvVideo.src = fullMediaUrl;
          tvVideo.currentTime = data.startTime || 0;
          tvVideo.muted = false;
          tvVideo.volume = 1.0;
          hideStandby();
          tvVideo.play().catch(() => {
            tvVideo.muted = true;
            tvVideo.play().catch(() => {});
          });
        } else if (data.type === 'media-control') {
          if (data.action === 'play') tvVideo.play().catch(() => {});
          if (data.action === 'pause') tvVideo.pause();
          if (data.action === 'seek' && typeof data.time === 'number') tvVideo.currentTime = data.time;
          if (data.action === 'jump' && typeof data.delta === 'number') tvVideo.currentTime += data.delta;
          if (data.action === 'volume' && typeof data.level === 'number') tvVideo.volume = Math.max(0, Math.min(1, data.level));
        } else if (data.type === 'set-aspect-ratio' && data.fit) {
          applyAspectRatio(data.fit, true);
        } else if (data.type === 'set-subtitles') {
          applySubtitles(data.vttContent, data.label || 'Subtitles');
        } else if (data.type === 'set-speed') {
          applyPlaybackSpeed(data.speed, true);
        } else if (data.type === 'set-audio-boost') {
          applyAudioBoost(data.boost);
        } else if (data.type === 'trigger-osd') {
          triggerOsd();
        } else if (data.type === 'switch-to-screen') {
          playbackMode = 'webrtc';
          tvVideo.pause();
          tvVideo.removeAttribute('src');
          tvVideo.load();
          showStandby('Welcome to SachCast', 'Waiting for your friend to start sharing... 🍿');
        }
      });

      dataConn.on('close', () => {
        statusLabel.innerText = 'Waiting for PC...';
      });
    }

    function applyManualCode() {
      const code = manualCodeInput.value.trim();
      if (code.length >= 4) {
        roomCode = code;
        statusLabel.innerText = `Joining room [ ${code} ]...`;
        initTVReceiver();
      }
    }

    function hideStandby() {
      standbyScreen.classList.add('hidden');
      standbyScreen.style.display = 'none';
      document.body.classList.add('playing');
    }

    function showStandby(title, sub) {
      document.body.classList.remove('playing');
      standbyScreen.classList.remove('hidden');
      standbyScreen.style.display = 'flex';
      screenTitle.innerText = title;
      screenSubtitle.innerText = sub;
      tvVideo.srcObject = null;
      remoteStream = null;
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    let toastTimeout = null;
    function showTvToast(msg) {
      const toast = document.getElementById('tvToast');
      if (!toast) return;
      toast.innerText = msg;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Unmuting on any user interaction (click, keypress, remote button)
    function handleUserGesture() {
      unlockAudio();
    }

    // Click, touch, mouse move on TV triggers the sleek OSD
    window.addEventListener('click', () => { handleUserGesture(); triggerOsd(); }, { passive: true });
    window.addEventListener('touchstart', () => { handleUserGesture(); triggerOsd(); }, { passive: true });
    window.addEventListener('mousemove', () => { triggerOsd(); }, { passive: true });
    window.addEventListener('dblclick', () => {
      if (document.body.classList.contains('playing')) {
        cycleAspectRatio();
      } else {
        toggleFullScreen();
      }
    });

    // Send real-time timeline progress back to presenter cockpit (throttled to 1s to prevent TV CPU freeze)
    let lastMediaStatusTime = 0;
    function sendMediaStatus(force = false) {
      if (playbackMode !== 'media') return;
      const now = performance.now();
      if (!force && (now - lastMediaStatusTime < 1000)) return;
      lastMediaStatusTime = now;

      const dataObj = {
        type: 'media-status',
        currentTime: Math.floor(tvVideo.currentTime || 0),
        duration: Math.floor(tvVideo.duration || 0),
        paused: tvVideo.paused,
        volume: tvVideo.volume,
        title: currentMediaTitle
      };
      const payload = JSON.stringify(dataObj);
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(payload);
      }
      if (dataConn && dataConn.open) {
        try { dataConn.send(dataObj); } catch(e) {}
      }
    }

    tvVideo.addEventListener('timeupdate', () => {
      sendMediaStatus(false);
      const osd = document.getElementById('tvOsd');
      if (osd && osd.classList.contains('show')) {
        updateOsdDisplay();
      }
    });
    tvVideo.addEventListener('play', () => {
      hideStandby();
      sendMediaStatus(true);
      triggerOsd();
    });
    tvVideo.addEventListener('playing', () => hideStandby());
    tvVideo.addEventListener('loadedmetadata', () => {
      hideStandby();
      applyAspectRatio(currentAspectRatio, false);
      triggerOsd();
    });
    tvVideo.addEventListener('pause', () => {
      sendMediaStatus(true);
      triggerOsd();
    });
    tvVideo.addEventListener('seeked', () => {
      sendMediaStatus(true);
      triggerOsd();
    });

    tvVideo.addEventListener('ended', () => {
      if (playbackMode === 'media') {
        showStandby('Movie Finished', 'The video has finished playing. 🎬');
      }
    });

    window.addEventListener('keydown', (e) => {
      handleUserGesture();
      triggerOsd();

      // Aspect ratio toggle keys on TV remote:
      // 'A' key, 'F' key, or Color buttons (Red 403, Green 404, Yellow 405, Blue 406)
      const isAspectKey = e.key === 'a' || e.key === 'A' || e.key === 'f' || e.key === 'F' ||
                          e.keyCode === 65 || e.keyCode === 70 || e.keyCode === 405 || e.keyCode === 406;

      if (isAspectKey) {
        cycleAspectRatio();
        return;
      }

      // S key: Cycle playback speed
      if (e.key === 's' || e.key === 'S') {
        const cur = tvVideo.playbackRate || 1.0;
        let nxt = 1.0;
        if (cur === 1.0) nxt = 1.25;
        else if (cur === 1.25) nxt = 1.5;
        else if (cur === 1.5) nxt = 2.0;
        else if (cur === 2.0) nxt = 0.75;
        else nxt = 1.0;
        applyPlaybackSpeed(nxt, true);
        return;
      }

      // C key: Toggle Subtitles
      if (e.key === 'c' || e.key === 'C') {
        if (tvVideo.textTracks && tvVideo.textTracks.length > 0) {
          const curMode = tvVideo.textTracks[0].mode;
          tvVideo.textTracks[0].mode = curMode === 'showing' ? 'hidden' : 'showing';
          const subBadge = document.getElementById('osdSubBadge');
          if (subBadge) subBadge.style.display = tvVideo.textTracks[0].mode === 'showing' ? 'inline-block' : 'none';
          showTvToast(tvVideo.textTracks[0].mode === 'showing' ? '💬 Subtitles ON' : '💬 Subtitles OFF');
          triggerOsd();
        }
        return;
      }

      // M key: Mute/Unmute
      if (e.key === 'm' || e.key === 'M') {
        tvVideo.muted = !tvVideo.muted;
        showTvToast(tvVideo.muted ? '🔇 Muted' : '🔊 Sound 100%');
        triggerOsd();
        return;
      }

      // Arrow Up / Down: Volume in Media mode, Aspect ratio in Screen Share
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        if (document.body.classList.contains('playing')) {
          if (playbackMode === 'media') {
            const delta = e.key === 'ArrowUp' ? 0.1 : -0.1;
            tvVideo.volume = Math.max(0, Math.min(1, tvVideo.volume + delta));
            showTvToast(`🔊 Volume: ${Math.round(tvVideo.volume * 100)}%`);
            triggerOsd();
          } else {
            cycleAspectRatio();
          }
          return;
        }
      }

      if (e.key === ' ' || e.keyCode === 32) {
        if (playbackMode === 'media') {
          if (tvVideo.paused) {
            tvVideo.play().catch(() => {});
            showTvToast('▶️ Play');
          } else {
            tvVideo.pause();
            showTvToast('⏸️ Pause');
          }
          triggerOsd();
        }
      } else if (e.key === 'ArrowRight' || e.keyCode === 39) {
        if (playbackMode === 'media') {
          tvVideo.currentTime += 10;
          showTvToast('⏩ +10s');
          triggerOsd();
        }
      } else if (e.key === 'ArrowLeft' || e.keyCode === 37) {
        if (playbackMode === 'media') {
          tvVideo.currentTime = Math.max(0, tvVideo.currentTime - 10);
          showTvToast('⏪ -10s');
          triggerOsd();
        }
      } else if (e.key === 'Enter' || e.keyCode === 13) {
        if (!standbyScreen.classList.contains('hidden') && document.activeElement === manualCodeInput) {
          applyManualCode();
        } else {
          toggleFullScreen();
        }
      }
    });

    setInterval(() => {
      if (!ws || ws.readyState === WebSocket.CLOSED) {
        tryLocalWebSocket();
      }
      if (signalingMode === 'cloud' && (!dataConn || !dataConn.open)) {
        connectToHostPeerJS();
      }
    }, 5000);

    applyAspectRatio(currentAspectRatio, false);
    initTVReceiver();
  </script>
</body>
</html>
