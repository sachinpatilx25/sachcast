<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SachCast - TV Receiver</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <script src="/peerjs.min.js"></script>
  <script>
    if (typeof Peer === 'undefined') {
      document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    #displayContainer {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000000;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    #standbyScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      z-index: 10;
      text-align: center;
      padding: 2.5rem;
      transition: opacity 0.4s ease;
    }

    .minimal-icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #0a0a0a;
      border: 1px solid #222222;
      display: grid;
      place-items: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.03em;
      color: #ffffff;
    }

    p {
      color: #777777;
      font-size: 1.15rem;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .code-box-wrapper {
      background: #0a0a0a;
      border: 1px solid #222222;
      border-radius: 14px;
      padding: 0.85rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .code-input {
      background: #000000;
      border: 1px solid #333333;
      border-radius: 8px;
      color: #ffffff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.6rem;
      letter-spacing: 0.25em;
      text-align: center;
      width: 140px;
      padding: 0.35rem;
      outline: none;
    }

    .code-input:focus {
      border-color: #ffffff;
    }

    .connect-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.7rem 1.4rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .connect-btn:hover {
      background: #e5e5e5;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.95rem;
      color: #888888;
      background: #050505;
      border: 1px solid #222222;
      padding: 0.5rem 1.4rem;
      border-radius: 9999px;
      font-weight: 500;
    }

    .indicator-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
    }

    .tv-hud {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    body:hover .tv-hud, body:focus-within .tv-hud, body.hud-visible .tv-hud {
      opacity: 1;
    }

    .tv-stat-pill {
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .hud-btn {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #333333;
      color: #ffffff;
      padding: 0.65rem 1.15rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.15s;
    }

    .hud-btn:hover, .hud-btn:focus {
      background: #ffffff;
      color: #000000;
    }

    #flashOverlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.25);
      z-index: 40;
      pointer-events: none;
      display: none;
    }

    #audioPrompt {
      display: none;
      position: absolute;
      bottom: 2.5rem;
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 1rem 1.8rem;
      z-index: 30;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      color: #ffffff;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <div id="flashOverlay"></div>

  <div class="tv-hud" id="tvHud">
    <div class="tv-stat-pill" id="hudStats">⚡ Ultra-Low Latency • 60 FPS • WebRTC</div>
    <button class="hud-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
  </div>

  <div id="standbyScreen">
    <div class="minimal-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
        <polyline points="17 2 12 7 7 2"></polyline>
      </svg>
    </div>

    <h1 id="screenTitle">SachCast Receiver</h1>
    <p id="screenSubtitle">Connected to receiver. Waiting for PC screen broadcast...</p>

    <div class="code-box-wrapper">
      <input type="text" id="manualCode" class="code-input" maxlength="4" value="7777">
      <button class="connect-btn" onclick="applyManualCode()">Connect</button>
    </div>

    <div class="status-badge" id="statusBadge">
      <div class="indicator-dot" id="statusDot"></div>
      <span id="statusLabel">Ready</span>
    </div>
  </div>

  <div id="displayContainer">
    <video id="tvVideo" autoplay playsinline webkit-playsinline muted></video>
  </div>

  <div id="audioPrompt" onclick="enableAudio()">
    🔊 Audio muted by TV browser. Press Remote OK or Click to unmute.
  </div>

  <script>
    const tvVideo = document.getElementById('tvVideo');
    const standbyScreen = document.getElementById('standbyScreen');
    const screenTitle = document.getElementById('screenTitle');
    const screenSubtitle = document.getElementById('screenSubtitle');
    const statusLabel = document.getElementById('statusLabel');
    const statusDot = document.getElementById('statusDot');
    const audioPrompt = document.getElementById('audioPrompt');
    const flashOverlay = document.getElementById('flashOverlay');
    const manualCodeInput = document.getElementById('manualCode');
    const hudStats = document.getElementById('hudStats');

    const urlParams = new URLSearchParams(window.location.search);
    let roomCode = urlParams.get('room') || '7777';
    manualCodeInput.value = roomCode;

    let signalingMode = 'unknown'; // 'lan' or 'cloud'
    let ws = null;
    let peer = null;
    let nativePc = null;
    let nativeDc = null;
    let dataConn = null;
    let currentPresenterId = null;
    let pendingCandidates = [];

    const rtcIceConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' }
      ]
    };

    function parseDeviceName() {
      const ua = (navigator.userAgent || '').toLowerCase();
      if (ua.includes('tizen')) return 'Samsung Smart TV';
      if (ua.includes('webos')) return 'LG webOS TV';
      if (ua.includes('googletv') || ua.includes('crkey')) return 'Google TV';
      if (ua.includes('firetv') || ua.includes('aft')) return 'Fire TV';
      if (ua.includes('android')) return 'Android TV';
      return 'Smart TV';
    }

    // Screen WakeLock to prevent TV screensaver
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          await navigator.wakeLock.request('screen');
        } catch (e) {}
      }
    }
    requestWakeLock();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    // Zero playout delay & zero jitter buffer
    function tuneVideoReceiver(pc) {
      if (!pc || !pc.getReceivers) return;
      pc.getReceivers().forEach(receiver => {
        if (receiver.track && receiver.track.kind === 'video') {
          if ('jitterBufferTarget' in receiver) {
            try { receiver.jitterBufferTarget = 0; } catch (e) {}
          }
          if ('playoutDelayHint' in receiver) {
            try { receiver.playoutDelayHint = 0; } catch (e) {}
          }
        }
      });
    }

    // Permanent zero-stutter drift eliminator
    // Uses smooth playback rate micro-adjustments instead of hard seeks to prevent hardware decoder flushing and slowdown
    setInterval(() => {
      if (!tvVideo.srcObject || tvVideo.paused) return;
      if (tvVideo.buffered && tvVideo.buffered.length > 0) {
        const end = tvVideo.buffered.end(tvVideo.buffered.length - 1);
        const drift = end - tvVideo.currentTime;

        if (drift > 1.2) {
          // Significant lag (e.g. computer sleep or background tab) -> clean live jump
          try {
            tvVideo.currentTime = end;
            tvVideo.playbackRate = 1.0;
          } catch (e) {}
        } else if (drift > 0.22) {
          // Micro-drift (220ms - 1200ms): subtly accelerate (1.06x) to catch up seamlessly
          // Zero decoder flush, zero frame drop, 100% smooth continuous playback!
          tvVideo.playbackRate = 1.06;
        } else if (drift < 0.08) {
          // Buffer caught up: return to normal 1.0x playback speed
          tvVideo.playbackRate = 1.0;
        }
      }
    }, 500);

    // Continuous playback protection: auto-resume if TV browser pauses or stalls
    tvVideo.addEventListener('stalled', () => {
      if (tvVideo.srcObject && !tvVideo.paused) {
        tvVideo.play().catch(() => {});
      }
    });
    tvVideo.addEventListener('waiting', () => {
      if (tvVideo.srcObject && !tvVideo.paused) {
        tvVideo.play().catch(() => {});
      }
    });
    tvVideo.addEventListener('pause', () => {
      if (tvVideo.srcObject && standbyScreen.style.display === 'none') {
        tvVideo.play().catch(() => {});
      }
    });

    // --- Hybrid Signaling Initialization ---
    function initTVReceiver() {
      if (window.location.protocol === 'file:' || !window.location.host) {
        initTVPeer();
        return;
      }
      tryLocalWebSocket();
    }

    function tryLocalWebSocket() {
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${window.location.host}`;
      console.log('[TV Signaling] Connecting to LAN WebSocket:', wsUrl);

      let connected = false;
      try {
        ws = new WebSocket(wsUrl);

        const timeout = setTimeout(() => {
          if (!connected) {
            console.log('[TV Signaling] Local WS timeout. Falling back to PeerJS Cloud...');
            try { ws.close(); } catch(e) {}
            initTVPeer();
          }
        }, 2000);

        ws.onopen = () => {
          connected = true;
          clearTimeout(timeout);
          signalingMode = 'lan';
          console.log('[TV Signaling] Connected via Direct LAN WebSocket ⚡');

          statusDot.style.background = '#ffffff';
          statusLabel.innerText = 'Connected to Host (LAN ⚡)';
          screenTitle.innerText = 'Paired with PC';
          screenSubtitle.innerText = 'Waiting for PC to start screen broadcast...';

          ws.send(JSON.stringify({
            type: 'register-viewer',
            code: roomCode
          }));
        };

        ws.onmessage = (event) => {
          handleWsMessage(event.data);
        };

        ws.onclose = () => {
          if (signalingMode === 'lan') {
            console.log('[TV Signaling] WS closed. Falling back to PeerJS...');
            signalingMode = 'cloud';
            initTVPeer();
          }
        };

        ws.onerror = () => {
          if (!connected) {
            clearTimeout(timeout);
            initTVPeer();
          }
        };
      } catch (e) {
        initTVPeer();
      }
    }

    async function handleWsMessage(raw) {
      try {
        const msg = JSON.parse(raw);

        if (msg.type === 'join-success') {
          console.log('[TV LAN] Registered. Room:', msg.code, 'Has presenter:', msg.hasPresenter);
          if (msg.code) {
            roomCode = msg.code;
            manualCodeInput.value = msg.code;
          }
          if (msg.presenterId) currentPresenterId = msg.presenterId;
          statusDot.style.background = '#ffffff';
          statusLabel.innerText = msg.hasPresenter ? 'Paired with PC ⚡' : 'Waiting for PC...';
          return;
        }

        if (msg.type === 'presenter-connected') {
          currentPresenterId = msg.presenterId;
          statusLabel.innerText = 'Presenter Ready';
          screenSubtitle.innerText = 'Presenter connected. Waiting for screen share...';
          return;
        }

        if (msg.type === 'presenter-disconnected') {
          showStandby('Broadcast Stopped', 'Presenter disconnected. Waiting for presenter to reconnect...');
          return;
        }

        if (msg.type === 'stream-stopped') {
          showStandby('Broadcast Stopped', 'Screen sharing stopped by presenter.');
          return;
        }

        if (msg.type === 'flash-ping') {
          flashScreen();
          return;
        }

        // WebRTC Offer from Presenter
        if (msg.type === 'signal-offer' && msg.offer) {
          currentPresenterId = msg.from;
          await handleNativeOffer(msg.offer, msg.from);
          return;
        }

        // ICE Candidate from Presenter
        if (msg.type === 'signal-candidate' && msg.candidate) {
          if (nativePc && nativePc.remoteDescription) {
            await nativePc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(() => {});
          } else {
            pendingCandidates.push(msg.candidate);
          }
          return;
        }

      } catch (err) {
        console.warn('TV WS parse error:', err);
      }
    }

    async function handleNativeOffer(offer, presenterId) {
      console.log('[WebRTC LAN] Processing offer from presenter:', presenterId);

      if (nativePc) {
        try { nativePc.close(); } catch(e) {}
      }

      nativePc = new RTCPeerConnection(rtcIceConfig);
      pendingCandidates = [];

      nativePc.ontrack = (event) => {
        console.log('[WebRTC LAN] Remote stream received:', event.streams);
        tuneVideoReceiver(nativePc);

        const stream = (event.streams && event.streams[0]) ? event.streams[0] : new MediaStream([event.track]);
        tvVideo.srcObject = stream;

        hideStandby();
        tvVideo.play().catch(() => {});

        // Prompt for audio unmute only if stream contains active audio tracks
        const hasAudio = stream.getAudioTracks().length > 0;
        if (hasAudio && tvVideo.muted) {
          audioPrompt.style.display = 'block';
        } else {
          audioPrompt.style.display = 'none';
        }
      };

      nativePc.ondatachannel = (event) => {
        nativeDc = event.channel;
        setupDataChannel(nativeDc);
      };

      nativePc.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'signal-candidate',
            target: presenterId,
            candidate: event.candidate
          }));
        }
      };

      try {
        await nativePc.setRemoteDescription(new RTCSessionDescription(offer));
        tuneVideoReceiver(nativePc);

        // Safely flush queued ICE candidates
        if (pendingCandidates.length > 0) {
          for (const cand of pendingCandidates) {
            await nativePc.addIceCandidate(new RTCIceCandidate(cand)).catch(() => {});
          }
          pendingCandidates = [];
        }

        const answer = await nativePc.createAnswer();
        await nativePc.setLocalDescription(answer);

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'signal-answer',
            target: presenterId,
            answer: nativePc.localDescription
          }));
        }
      } catch (err) {
        console.error('Error handling native offer:', err);
      }
    }

    function setupDataChannel(dc) {
      dc.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);

          if (data.type === 'ping' && data.t) {
            if (dc.readyState === 'open') {
              dc.send(JSON.stringify({ type: 'pong', t: data.t }));
            }
            return;
          }

          if (data.type === 'stats') {
            hudStats.innerText = `⚡ ${data.rtt}ms | 60 FPS | Native Quality`;
            showHudBriefly();
          }
        } catch (e) {}
      };
    }

    // --- PeerJS Cloud Fallback ---
    function initTVPeer() {
      if (peer) {
        try { peer.destroy(); } catch (e) {}
      }
      signalingMode = 'cloud';
      const viewerPeerId = 'sachcast-tv-' + roomCode + '-' + Math.random().toString(36).substring(2, 7);
      console.log('[PeerJS Cloud] Starting TV peer with ID:', viewerPeerId);

      peer = new Peer(viewerPeerId, {
        debug: 1,
        config: rtcIceConfig
      });

      peer.on('open', () => {
        statusDot.style.background = '#ffffff';
        statusLabel.innerText = 'Connected (Cloud ☁️)';
        connectToHostPeerJS();
      });

      peer.on('call', (call) => {
        call.answer();

        if (call.peerConnection) {
          tuneVideoReceiver(call.peerConnection);
        }

        call.on('stream', (remoteStream) => {
          hideStandby();
          tvVideo.srcObject = remoteStream;
          tuneVideoReceiver(call.peerConnection);

          tvVideo.play().catch(() => {});

          const hasAudio = remoteStream.getAudioTracks().length > 0;
          if (hasAudio && tvVideo.muted) {
            audioPrompt.style.display = 'block';
          } else {
            audioPrompt.style.display = 'none';
          }
        });
      });

      peer.on('error', (err) => {
        console.warn('TV Peer error:', err.type);
        statusLabel.innerText = 'Retrying connection...';
      });
    }

    function connectToHostPeerJS() {
      if (!peer || peer.destroyed) return;
      const hostPeerId = 'sachcast-host-' + roomCode;

      if (dataConn) {
        try { dataConn.close(); } catch (e) {}
      }

      dataConn = peer.connect(hostPeerId);

      dataConn.on('open', () => {
        statusLabel.innerText = 'Paired with PC';
        screenTitle.innerText = 'Paired with PC';
        screenSubtitle.innerText = 'Click "Share Screen" on your computer to broadcast.';
        dataConn.send({ type: 'hello', deviceName: parseDeviceName() });
      });

      dataConn.on('data', (data) => {
        if (data && data.type === 'flash-ping') {
          flashScreen();
        } else if (data && data.type === 'stream-stopped') {
          showStandby('Broadcast Stopped', 'Waiting for PC to resume sharing...');
        }
      });

      dataConn.on('close', () => {
        statusLabel.innerText = 'Waiting for PC...';
      });
    }

    function applyManualCode() {
      const code = manualCodeInput.value.trim();
      if (code.length >= 4) {
        roomCode = code;
        statusLabel.innerText = `Connecting to [ ${code} ]...`;
        initTVReceiver();
      }
    }

    function hideStandby() {
      standbyScreen.style.opacity = '0';
      setTimeout(() => {
        standbyScreen.style.display = 'none';
      }, 400);
      showHudBriefly();
    }

    function showStandby(title, sub) {
      standbyScreen.style.display = 'flex';
      setTimeout(() => { standbyScreen.style.opacity = '1'; }, 10);
      screenTitle.innerText = title;
      screenSubtitle.innerText = sub;
      tvVideo.srcObject = null;
      audioPrompt.style.display = 'none';
    }

    function flashScreen() {
      flashOverlay.style.display = 'block';
      setTimeout(() => { flashOverlay.style.display = 'none'; }, 400);
    }

    function enableAudio() {
      tvVideo.muted = false;
      tvVideo.play().catch(() => {});
      audioPrompt.style.display = 'none';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    let hudTimer = null;
    function showHudBriefly() {
      document.body.classList.add('hud-visible');
      if (hudTimer) clearTimeout(hudTimer);
      hudTimer = setTimeout(() => {
        document.body.classList.remove('hud-visible');
      }, 4000);
    }

    window.addEventListener('keydown', (e) => {
      enableAudio();
      showHudBriefly();

      if (e.key === 'Enter' || e.keyCode === 13 || e.key === ' ' || e.keyCode === 32) {
        if (standbyScreen.style.display !== 'none' && document.activeElement === manualCodeInput) {
          applyManualCode();
        } else {
          toggleFullScreen();
        }
      }
    });

    window.addEventListener('click', () => {
      enableAudio();
      showHudBriefly();
    });

    window.addEventListener('mousemove', () => {
      showHudBriefly();
    });

    setInterval(() => {
      if (signalingMode === 'cloud' && (!dataConn || !dataConn.open)) {
        connectToHostPeerJS();
      }
    }, 5000);

    initTVReceiver();
  </script>
</body>
</html>
